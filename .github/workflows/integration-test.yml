name: Full Integration Test with Backend

on:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: 'Run UI tests (requires browser)'
        required: false
        default: true
        type: boolean

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: qa_training
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Set up Chrome
        if: ${{ inputs.run_ui_tests == true }}
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up ChromeDriver
        if: ${{ inputs.run_ui_tests == true }}
        uses: nanasess/setup-chromedriver@v2

      - name: Configure headless browser for CI
        run: |
          cat > src/test/resources/config.properties << EOF
          api.baseUrl=http://localhost:8080
          api.auth.loginPath=/api/auth/login
          ui.baseUrl=http://localhost:8080
          ui.loginPath=/ui/login
          browser=chrome
          browser.headless=true
          browser.window.width=1920
          browser.window.height=1080
          timeout.implicit=10
          timeout.explicit=10
          timeout.page.load=30
          EOF

      - name: Start Backend Application
        run: |
          java -jar application/qa-training-app.jar \
            --spring.datasource.url=jdbc:mysql://localhost:3306/qa_training?useSSL=false\&allowPublicKeyRetrieval=true \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.jpa.hibernate.ddl-auto=update &
          echo "Waiting for application to start..."
          sleep 60
          curl -f http://localhost:8080/actuator/health || curl -f http://localhost:8080 || echo "App started"

      - name: Run All Tests
        run: mvn clean test -B -DtestFailureIgnore=true
        continue-on-error: true

      - name: Generate Cucumber Report
        if: always()
        run: mvn exec:java@report -B || true

      - name: Upload All Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-full
          path: |
            target/cucumber-report.html
            target/cucumber-report.json
            target/cucumber-report.xml
            target/cucumber-advanced-report/
            target/surefire-reports/
          retention-days: 30

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Generate Test Summary
        if: always()
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f target/cucumber-report.json ]; then
            echo "✅ Cucumber JSON report generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Cucumber JSON report not found" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d target/cucumber-advanced-report ]; then
            echo "✅ Advanced Cucumber report generated" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Advanced Cucumber report not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download Reports" >> $GITHUB_STEP_SUMMARY
          echo "Reports are available as artifacts in the Actions tab" >> $GITHUB_STEP_SUMMARY
