version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qa-training-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: qa_training
      MYSQL_USER: qa_user
      MYSQL_PASSWORD: qa_pass123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qa-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa-training-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/qa_training?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qa-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  qa-network:
    driver: bridge
