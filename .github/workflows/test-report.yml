name: Test and Report

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: qa_training
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Configure test properties for CI
        run: |
          cat > src/test/resources/config.properties << EOF
          api.baseUrl=http://localhost:8080
          api.auth.loginPath=/api/auth/login
          ui.baseUrl=http://localhost:8080
          ui.loginPath=/ui/login
          browser=chrome
          browser.headless=true
          browser.window.width=1920
          browser.window.height=1080
          timeout.implicit=10
          timeout.explicit=10
          timeout.page.load=30
          EOF

      - name: Verify JAR file exists
        run: |
          if [ -f "application/qa-training-app.jar" ]; then
            echo "✅ JAR file found"
            ls -la application/
          else
            echo "❌ JAR file not found at application/qa-training-app.jar"
            echo "Available files:"
            find . -name "*.jar" 2>/dev/null || echo "No JAR files found"
            exit 1
          fi

      - name: Start Backend Application
        run: |
          java -jar application/qa-training-app.jar \
            --spring.datasource.url=jdbc:mysql://localhost:3306/qa_training?useSSL=false\&allowPublicKeyRetrieval=true \
            --spring.datasource.username=root \
            --spring.datasource.password=root \
            --spring.jpa.hibernate.ddl-auto=update &
          echo "Waiting for application to start..."
          sleep 60
          curl -f http://localhost:8080/actuator/health || curl -f http://localhost:8080 || echo "App started"

      - name: Run All Tests
        run: mvn clean test -B -DtestFailureIgnore=true
        continue-on-error: true

      - name: Generate Cucumber Report
        if: always()
        run: |
          mvn exec:java@report -B || echo "Report generation completed with warnings"

      - name: Upload Cucumber JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json-report
          path: target/cucumber-report.json
          retention-days: 30

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-report.html
          retention-days: 30

      - name: Upload Advanced Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-advanced-report
          path: target/cucumber-advanced-report/
          retention-days: 30

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Add Test Summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '## 🧪 Test Automation Report\n\n';
            
            // Read surefire summary if available
            try {
              const files = fs.readdirSync('target/surefire-reports');
              const txtFiles = files.filter(f => f.endsWith('.txt'));
              if (txtFiles.length > 0) {
                const content = fs.readFileSync(`target/surefire-reports/${txtFiles[0]}`, 'utf8');
                summary += '### Surefire Summary\n```\n' + content + '\n```\n\n';
              }
            } catch (e) {
              summary += '⚠️ Surefire reports not available\n\n';
            }
            
            summary += '### 📊 Reports Available\n';
            summary += '- Download **cucumber-html-report** artifact for detailed HTML report\n';
            summary += '- Download **cucumber-advanced-report** artifact for advanced report\n';
            summary += '- Download **surefire-reports** artifact for JUnit XML reports\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
